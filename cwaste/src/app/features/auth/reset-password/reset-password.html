<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Reset Password</h2>
      <p>Set a new password for your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            formControlName="email"
            placeholder="Your registered email"
          />
        </div>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.error]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
          />
        </div>
        <div class="error-message" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid">
          <span *ngIf="form.get('newPassword')?.errors?.['required']">New password is required</span>
          <span *ngIf="form.get('newPassword')?.errors?.['minlength']">Minimum 6 characters required</span>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            [class.error]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
          />
        </div>
        <div class="error-message" *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">
          <span *ngIf="form.get('confirmPassword')?.errors?.['required']">Confirm password is required</span>
        </div>

        <!-- Mismatch error shown here -->
        <div class="error-message" *ngIf="form.errors?.['mismatch'] && form.touched">
          Passwords do not match
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="login-button" [disabled]="form.invalid || isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <div *ngIf="isLoading" class="loading-spinner">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
              <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
              <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
            </circle>
          </svg>
          Resetting...
        </div>
      </button>

      <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
    </form>

    <div class="login-footer">
      <p>
        Back to
        <a routerLink="/auth/login" class="register-link">Login</a>
      </p>
    </div>
  </div>
</div>
